name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # 1. Code Quality & Linting (MegaLinter)
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@v8
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_LINTERS: SPELL_CSPELL,SPELL_LYCHEE,REPOSITORY_GRYPE,JSON_PRETTIER,YAML_PRETTIER,CSS_STYLELINT,JAVASCRIPT_STANDARD,MARKDOWN_MARKDOWN_LINK_CHECK
          DISABLE_ERRORS_LINTERS: HTML_HTMLHINT,HTML_DJLINT

  # 2. Link Validation (Lychee)
  link-check:
    name: Link Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude "api.web3forms.com" --exclude "RameshResumeV9.pdf" --exclude "LICENSE" "*.html" "assets/**/*.js" "README.md"

  # 3. Functional E2E Tests (Playwright)
  e2e-testing:
    name: Functional E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 4. Performance & Accessibility Audit (Lighthouse)
  lighthouse-audit:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: lhci autorun

  # 5. Security & Static Analysis (SonarQube)
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Code
        if: env.SONAR_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: sonarsource/sonarqube-scan-action@v6

      - name: SonarQube Quality Gate Check
        if: env.SONAR_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600

  # 6. Assign Copilot Reviewer (PRs only)
  assign-copilot:
    name: Assign Copilot Reviewer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Request review from Copilot
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-reviewer "@copilot"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
