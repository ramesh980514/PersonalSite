name: Develop Branch CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clone for accurate analysis

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  quality-checks:
    name: Code Quality & Performance Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          # If no package-lock.json exists, we fall back to setup without caching
        continue-on-error: true

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Run Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude "api.web3forms.com" --exclude "RameshResumeV9.pdf" --exclude "LICENSE" "*.html" "assets/**/*.js" "README.md"

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_LINTERS: SPELL_CSPELL,SPELL_LYCHEE,REPOSITORY_GRYPE,JSON_PRETTIER,YAML_PRETTIER,CSS_STYLELINT,JAVASCRIPT_STANDARD,MARKDOWN_MARKDOWN_LINK_CHECK
          DISABLE_ERRORS_LINTERS: HTML_HTMLHINT,HTML_DJLINT
